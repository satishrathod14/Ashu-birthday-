<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Ashu ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    overflow-x:hidden;
    background:#090014;
    color:white;
    font-family:Arial,sans-serif;
    text-align:center;
}

.screen{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:25px;
    animation:fade .9s ease;
}

.box{
    width:100%;
    max-width:520px;
}

.hidden{
    display:none!important;
}

h1{
    font-size:42px;
    margin-bottom:20px;
    text-shadow:0 0 25px #ff4fa3;
}

h2{
    font-size:30px;
    margin-bottom:20px;
}

p{
    font-size:18px;
    line-height:1.7;
}

button{
    margin-top:30px;
    padding:15px 30px;
    border:0;
    border-radius:40px;
    font-size:17px;
    font-weight:bold;
    color:#c21867;
    background:white;
    box-shadow:0 0 25px #ff75b7;
    cursor:pointer;
}

button:active{
    transform:scale(.93);
}

/* Opening */

.opening{
    background:
    radial-gradient(circle at 50% 30%,#ff318a55,transparent 35%),
    linear-gradient(135deg,#090014,#30002f,#12001f);
}

.heart{
    font-size:90px;
    animation:heartbeat 1.2s infinite;
}

/* Typing */

.typing{
    min-height:80px;
    font-size:22px;
    color:#ffc4e1;
}

/* Gift */

.gift{
    font-size:125px;
    margin:35px 0;
    cursor:pointer;
    animation:bounce 1.5s infinite;
}

/* Cake */

.cake{
    font-size:120px;
    animation:float 2s infinite;
}

/* Glass card */

.card{
    padding:30px 22px;
    border-radius:28px;
    background:rgba(255,255,255,.09);
    border:1px solid rgba(255,255,255,.18);
    box-shadow:0 0 40px rgba(255,50,150,.25);
    backdrop-filter:blur(15px);
}

/* Photo gallery */

.photos{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-top:20px;
}

.photos img{
    width:100%;
    height:170px;
    object-fit:cover;
    border-radius:18px;
    border:2px solid #ffffff33;
    box-shadow:0 0 15px #ff4f9a55;
}

/* Secret */

.secret{
    font-size:80px;
    cursor:pointer;
    animation:heartbeat 1.4s infinite;
}

/* Floating hearts */

.floatHeart{
    position:fixed;
    bottom:-50px;
    pointer-events:none;
    animation:rise linear forwards;
}

/* Confetti */

.confetti{
    position:fixed;
    top:-30px;
    pointer-events:none;
    animation:confettiFall linear forwards;
}

/* Stars */

.star{
    position:fixed;
    pointer-events:none;
    animation:starFall linear forwards;
}

/* Animations */

@keyframes fade{
    from{
        opacity:0;
        transform:translateY(30px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes heartbeat{
    0%,100%{
        transform:scale(1);
    }
    50%{
        transform:scale(1.25);
    }
}

@keyframes bounce{
    0%,100%{
